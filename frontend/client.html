<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Client Dashboard — post projects, view ranked bids, accept proposals, and rate freelancers.">
  <title>Client Dashboard — BidForge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" aria-label="Main Navigation">
    <div class="container">
      <a href="/client.html" class="navbar-brand">
        <div class="logo-icon">⚡</div>
        BidForge
      </a>
      <div class="navbar-actions">
        <button class="btn btn-primary btn-sm" onclick="openModal('create-project-modal')">+ New Project</button>
        <div class="navbar-user">
          <span id="nav-username"></span>
          <div class="user-avatar" id="nav-avatar" aria-hidden="true"></div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="logout()" aria-label="Sign out">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Dashboard -->
  <main class="container dashboard">
    <header class="dashboard-header">
      <h1>Client Dashboard</h1>
      <p class="subtitle">Post projects, review bids, and hire top freelancers</p>
    </header>

    <!-- Stats -->
    <section class="stats-row" aria-label="Marketplace summary statistics">
      <div class="glass-card stat-card no-hover">
        <div class="stat-value" id="stat-open">0</div>
        <div class="stat-label">Open Projects</div>
      </div>
      <div class="glass-card stat-card no-hover">
        <div class="stat-value" id="stat-progress">0</div>
        <div class="stat-label">In Progress</div>
      </div>
      <div class="glass-card stat-card no-hover">
        <div class="stat-value" id="stat-completed">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="glass-card stat-card no-hover">
        <div class="stat-value" id="stat-bids">0</div>
        <div class="stat-label">Total Bids</div>
      </div>
    </section>

    <!-- Projects Section -->
    <div class="section-header">
      <h2>My Projects</h2>
      <button class="btn btn-secondary btn-sm" onclick="loadMyProjects()" aria-label="Refresh project list">↻ Refresh</button>
    </div>

    <div id="projects-list" class="projects-list" aria-live="polite">
      <div class="loading-overlay"><div class="spinner"></div></div>
    </div>
  </main>

  <!-- Create Project Modal -->
  <div class="modal-overlay" id="create-project-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title-project">
      <div class="modal-header">
        <h2 id="modal-title-project">Post New Project</h2>
        <button class="modal-close" aria-label="Close dialog">✕</button>
      </div>
      <form id="create-project-form">
        <div class="form-group">
          <label class="form-label" for="proj-title">Project Title</label>
          <input class="form-input" type="text" id="proj-title" placeholder="e.g., Build a React Dashboard" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="proj-desc">Description</label>
          <textarea class="form-textarea" id="proj-desc" placeholder="Describe the project scope, deliverables, and any specific requirements..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="proj-skills">Required Skills</label>
          <input class="form-input" type="text" id="proj-skills" placeholder="e.g., Python, React, SQL (comma-separated)">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="proj-budget-min">Budget Min ($)</label>
            <input class="form-input" type="number" id="proj-budget-min" min="1" step="1" placeholder="500" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="proj-budget-max">Budget Max ($)</label>
            <input class="form-input" type="number" id="proj-budget-max" min="1" step="1" placeholder="5000" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="proj-deadline">Deadline</label>
          <input class="form-input" type="datetime-local" id="proj-deadline" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: var(--space-sm);">Post Project</button>
      </form>
    </div>
  </div>

  <!-- Ranked Bids Modal -->
  <div class="modal-overlay" id="bids-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title-bids" style="max-width: 720px;">
      <div class="modal-header">
        <h2 id="modal-title-bids">🏆 Ranked Bids</h2>
        <button class="modal-close" aria-label="Close dialog">✕</button>
      </div>
      <div id="bids-list" style="display: flex; flex-direction: column; gap: var(--space-md); max-height: 60vh; overflow-y: auto;">
      </div>
    </div>
  </div>

  <!-- Rating Modal -->
  <div class="modal-overlay" id="rating-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title-rating" style="max-width: 440px;">
      <div class="modal-header">
        <h2 id="modal-title-rating">★ Rate Freelancer</h2>
        <button class="modal-close" aria-label="Close dialog">✕</button>
      </div>
      <form id="rating-form">
        <div class="form-group" style="text-align: center;">
          <label class="form-label">Your Rating</label>
          <div style="font-size: 2rem; margin: var(--space-md) 0;">
            <div class="star-rating" data-rating="0" data-name="score" role="radiogroup" aria-label="Select star rating" tabindex="0">
              <span class="star" data-value="1" role="radio" aria-checked="false" aria-label="1 star" tabindex="-1">★</span>
              <span class="star" data-value="2" role="radio" aria-checked="false" aria-label="2 stars" tabindex="-1">★</span>
              <span class="star" data-value="3" role="radio" aria-checked="false" aria-label="3 stars" tabindex="-1">★</span>
              <span class="star" data-value="4" role="radio" aria-checked="false" aria-label="4 stars" tabindex="-1">★</span>
              <span class="star" data-value="5" role="radio" aria-checked="false" aria-label="5 stars" tabindex="-1">★</span>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="rating-review">Review (optional)</label>
          <textarea class="form-textarea" id="rating-review" placeholder="Share your experience working with this freelancer..."></textarea>
        </div>
        <button type="submit" class="btn btn-gold btn-lg" style="width: 100%;">Submit Rating</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/client.js"></script>
</body>
</html>
