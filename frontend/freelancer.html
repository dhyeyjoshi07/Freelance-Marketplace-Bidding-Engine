<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Freelancer Dashboard — browse projects, submit bids, track proposals, and manage your profile.">
  <title>Freelancer Dashboard — BidForge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" aria-label="Main Navigation">
    <div class="container">
      <a href="/freelancer.html" class="navbar-brand">
        <div class="logo-icon">⚡</div>
        BidForge
      </a>
      <div class="navbar-actions">
        <div class="navbar-user">
          <span id="nav-username"></span>
          <div class="user-avatar" id="nav-avatar" aria-hidden="true"></div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="logout()" aria-label="Sign out">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Dashboard -->
  <main class="container dashboard">
    <header class="dashboard-header">
      <h1>Freelancer Dashboard</h1>
      <p class="subtitle">Find projects, submit bids, and grow your career</p>
    </header>

    <!-- Stats -->
    <div class="stats-row">
      <div class="glass-card stat-card no-hover">
        <div class="stat-value" id="stat-bids">0</div>
        <div class="stat-label">Bids Placed</div>
      </div>
      <div class="glass-card stat-card no-hover">
        <div class="stat-value" id="stat-active">0</div>
        <div class="stat-label">Active Projects</div>
      </div>
      <div class="glass-card stat-card no-hover">
        <div class="stat-value" id="stat-completed">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="glass-card stat-card no-hover">
        <div class="stat-value" id="stat-earned">$0</div>
        <div class="stat-label">Earned</div>
      </div>
    </div>

    <!-- Two Column Layout -->
    <div class="grid-2" style="align-items: flex-start;">
      <!-- Left: Tabs for Projects & Bids -->
      <div>
        <div>
          <div class="tabs" role="tablist" aria-label="Freelancer views">
            <button class="tab active" data-tab="tab-browse" role="tab" aria-selected="true" aria-controls="tab-browse" id="tab-btn-browse">Browse Projects</button>
            <button class="tab" data-tab="tab-bids" role="tab" aria-selected="false" aria-controls="tab-bids" id="tab-btn-bids">My Bids</button>
          </div>

          <!-- Browse Projects Tab -->
          <div class="tab-content active" id="tab-browse" role="tabpanel" aria-labelledby="tab-btn-browse">
            <div class="section-header">
              <h2 style="font-size: 1.1rem;">Open Projects</h2>
              <button class="btn btn-secondary btn-sm" onclick="loadOpenProjects()" aria-label="Refresh open projects">↻ Refresh</button>
            </div>
            <div id="open-projects-list" class="projects-list">
              <div class="loading-overlay"><div class="spinner"></div></div>
            </div>
          </div>

          <!-- My Bids Tab -->
          <div class="tab-content" id="tab-bids" role="tabpanel" aria-labelledby="tab-btn-bids">
            <div class="section-header">
              <h2 style="font-size: 1.1rem;">My Bids</h2>
              <button class="btn btn-secondary btn-sm" onclick="loadMyBids()" aria-label="Refresh my bids">↻ Refresh</button>
            </div>
            <div id="my-bids-list" class="projects-list">
              <div class="loading-overlay"><div class="spinner"></div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right: Profile Card -->
      <div>
        <div class="glass-card no-hover" id="profile-card">
          <div class="loading-overlay"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Submit Bid Modal -->
  <div class="modal-overlay" id="bid-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title-bid" style="max-width: 480px;">
      <div class="modal-header">
        <h2 id="modal-title-bid">Submit Bid</h2>
        <button class="modal-close" aria-label="Close dialog">✕</button>
      </div>
      <div style="margin-bottom: var(--space-lg); padding: var(--space-md); background: var(--bg-surface-2); border-radius: var(--radius-md);">
        <p class="text-sm text-muted">PROJECT</p>
        <p class="fw-600" id="bid-project-title"></p>
        <p class="text-sm mt-sm">
          <span class="text-muted">Budget: </span>
          <span class="text-emerald fw-600" id="bid-budget-range"></span>
        </p>
      </div>
      <form id="bid-form">
        <div class="form-group">
          <label class="form-label" for="bid-amount">Your Bid Amount ($)</label>
          <input class="form-input" type="number" id="bid-amount" min="1" step="1" placeholder="Enter your bid amount" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="bid-proposal">Proposal</label>
          <textarea class="form-textarea" id="bid-proposal" placeholder="Why are you the best fit for this project? Highlight your relevant experience..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Submit Bid</button>
      </form>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="profile-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title-profile" style="max-width: 480px;">
      <div class="modal-header">
        <h2 id="modal-title-profile">Edit Profile</h2>
        <button class="modal-close" aria-label="Close dialog">✕</button>
      </div>
      <form id="profile-form">
        <div class="form-group">
          <label class="form-label" for="profile-skills">Skills</label>
          <input class="form-input" type="text" id="profile-skills" placeholder="e.g., Python, React, SQL (comma-separated)">
          <span class="text-xs text-muted">Separate skills with commas. These are matched against project requirements.</span>
        </div>
        <div class="form-group">
          <label class="form-label" for="profile-rate">Hourly Rate ($)</label>
          <input class="form-input" type="number" id="profile-rate" min="1" step="1" placeholder="65" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Save Profile</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/freelancer.js"></script>
</body>
</html>
