<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Freelance Marketplace — where clients post projects and freelancers bid. Smart ranking engine scores bids on fit, not just price.">
  <title>BidForge — Freelance Marketplace</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <!-- Decorative background shapes -->
    <div style="position: fixed; top: -30%; right: -10%; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(16,185,129,0.06), transparent 70%); pointer-events: none;"></div>
    <div style="position: fixed; bottom: -20%; left: -10%; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(251,191,36,0.04), transparent 70%); pointer-events: none;"></div>

    <div class="auth-container">
      <!-- Logo -->
      <div class="auth-header">
        <div class="logo">
          <div class="logo-icon">⚡</div>
          BidForge
        </div>
        <p>Smart freelance marketplace with AI-powered bid ranking</p>
      </div>

      <!-- Login / Register Toggle -->
      <div class="glass-card no-hover">
        <div class="auth-toggle" id="auth-toggle">
          <button class="toggle-btn active" data-mode="login" onclick="switchAuthMode('login')">Sign In</button>
          <button class="toggle-btn" data-mode="register" onclick="switchAuthMode('register')">Create Account</button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label class="form-label" for="login-username">Username</label>
            <input class="form-input" type="text" id="login-username" placeholder="Enter your username" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input class="form-input" type="password" id="login-password" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: var(--space-sm);">
            Sign In →
          </button>
        </form>

        <!-- Register Form -->
        <form id="register-form" class="auth-form hidden">
          <div class="form-group">
            <label class="form-label" for="reg-username">Username</label>
            <input class="form-input" type="text" id="reg-username" placeholder="Choose a username" minlength="3" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Email</label>
            <input class="form-input" type="email" id="reg-email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input class="form-input" type="password" id="reg-password" placeholder="Min 6 characters" minlength="6" required>
          </div>
          <div class="form-group">
            <label class="form-label">I am a...</label>
            <div class="role-selector" id="role-selector">
              <div class="role-option selected" data-role="client" onclick="selectRole('client')">
                <div class="role-icon">💼</div>
                Client
              </div>
              <div class="role-option" data-role="freelancer" onclick="selectRole('freelancer')">
                <div class="role-icon">🛠️</div>
                Freelancer
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: var(--space-sm);">
            Create Account →
          </button>
        </form>
      </div>

      <!-- Features Tagline -->
      <div style="text-align: center; margin-top: var(--space-xl); color: var(--text-muted); font-size: 0.8rem;">
        <p>🏆 Smart Ranking &nbsp;·&nbsp; 🔒 Secure Auth &nbsp;·&nbsp; ⚡ Real-time Scoring</p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Redirect if already logged in
    redirectIfLoggedIn();

    let selectedRole = 'client';

    function switchAuthMode(mode) {
      document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
      });
      document.getElementById('login-form').classList.toggle('hidden', mode !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', mode !== 'register');
    }

    function selectRole(role) {
      selectedRole = role;
      document.querySelectorAll('.role-option').forEach(opt => {
        opt.classList.toggle('selected', opt.dataset.role === role);
      });
    }

    // Login handler
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        username: document.getElementById('login-username').value,
        password: document.getElementById('login-password').value,
      };
      const res = await authAPI.login(body);
      if (res.ok) {
        saveAuth(res.data);
        showToast('Welcome back!', 'success');
        setTimeout(() => {
          window.location.href = res.data.role === 'client' ? '/client.html' : '/freelancer.html';
        }, 500);
      } else {
        showToast(res.error, 'error');
      }
    });

    // Register handler
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        username: document.getElementById('reg-username').value,
        email: document.getElementById('reg-email').value,
        password: document.getElementById('reg-password').value,
        role: selectedRole,
      };
      const res = await authAPI.register(body);
      if (res.ok) {
        showToast('Account created! Signing you in...', 'success');
        // Auto-login after registration
        const loginRes = await authAPI.login({
          username: body.username,
          password: body.password,
        });
        if (loginRes.ok) {
          saveAuth(loginRes.data);
          setTimeout(() => {
            window.location.href = loginRes.data.role === 'client' ? '/client.html' : '/freelancer.html';
          }, 500);
        }
      } else {
        showToast(res.error, 'error');
      }
    });
  </script>
</body>
</html>
